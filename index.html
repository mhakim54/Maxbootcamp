<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arnold's Tweets</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="header-content">
            <h1>Arnold's Tweets</h1>
            <p class="tagline">I'll be back... on your timeline.</p>
        </div>
    </header>

    <main>
        <div class="controls">
            <button id="read-all-btn" class="btn btn-primary">
                <span class="btn-icon">&#9654;</span> Read All Tweets
            </button>
            <button id="stop-btn" class="btn btn-secondary" disabled>
                <span class="btn-icon">&#9632;</span> Stop
            </button>
        </div>

        <div id="tweets-container"></div>
    </main>

    <footer>
        <p>ArnoldsTweets.com &mdash; Not affiliated with Arnold Schwarzenegger.</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
